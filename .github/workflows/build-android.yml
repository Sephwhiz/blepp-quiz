name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Verify Supabase Installation
        run: |
          if [ ! -d "node_modules/@supabase/supabase-js" ]; then
            echo "Supabase not found! Reinstalling specifically..."
            npm install @supabase/supabase-js --legacy-peer-deps
          else
            echo "Supabase found successfully."
          fi
      
      - name: Build Next.js app for Static Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Force static export output to ./out directory
          npx next build
          # If next.config.ts has output: 'export', this creates ./out automatically
          # If not, we may need to check the config, but let's try standard build first
      
      - name: Verify Out Directory Exists
        run: |
          if [ ! -d "out" ] || [ ! -f "out/index.html" ]; then
            echo "ERROR: ./out directory or index.html missing!"
            echo "Contents of current directory:"
            ls -la
            exit 1
          else
            echo "SUCCESS: ./out directory found with index.html"
          fi
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
      
      - name: Initialize Capacitor
        run: npx cap init LicTech com.lictech.app --web-dir=out || true
      
      - name: Add Android Platform
        run: npx cap add android
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Build Android AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v5
        with:
          name: lictech-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30